# ─────────────────────────────────────────────────────────────
# Go'zal Ayol — Nginx konfiguratsiyasi
# /etc/nginx/sites-available/gozalayol → sites-enabled ga symlink
#
# DOMEN.UZ ni haqiqiy domenga almashtiring (uch joyda).
# ─────────────────────────────────────────────────────────────

# Rasm yuklashga alohida chegara: bitta IP butun diskni to'ldirmasin
limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMEN.UZ www.DOMEN.UZ;

    # Let's Encrypt tekshiruvi HTTPS'ga yo'naltirilmasligi kerak
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMEN.UZ www.DOMEN.UZ;

    # certbot qo'yadi
    ssl_certificate     /etc/letsencrypt/live/DOMEN.UZ/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMEN.UZ/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HSTS: brauzer keyingi safar HTTP'ga umuman urinmaydi.
    # ⚠️ Domen HTTPS'da barqaror ishlaganiga ishonch hosil qilib yoqing —
    # ortga qaytarish qiyin (brauzerlar keshlaydi)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Yuklash hajmi: 5 MB rasm × 10 ta + zaxira
    client_max_body_size 60m;

    # Booking so'rovlari qisqa, lekin sitemap generatsiyasi sekinroq
    proxy_read_timeout 60s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ── API ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Rate limit va loglar uchun haqiqiy IP kerak.
        # ⚠️ app.js da `trust proxy` yoqilgan — busiz hamma so'rov
        # bitta IP'dan kelayotgandek ko'rinadi va limitlar noto'g'ri ishlaydi
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rasm yuklash: alohida chegara
    location /api/owner/salon/images {
        limit_req zone=uploads burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Yuklangan rasmlar ──────────────────────────────────
    # Node orqali emas, to'g'ridan-to'g'ri diskdan: tezroq va API'ni bo'shatadi
    location /uploads/ {
        alias /var/www/gozalayol/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Yuklangan papkadan skript bajarilishiga yo'l qo'yilmaydi
        location ~ \.(php|js|html|htm)$ {
            deny all;
        }
    }

    # ── SEO ────────────────────────────────────────────────
    # sitemap bazadan generatsiya qilinadi, shuning uchun API'ga ketadi
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/api/sitemap.xml;
        proxy_set_header Host $host;
    }

    # ── Frontend (SPA) ─────────────────────────────────────
    root /var/www/gozalayol/web;
    index index.html;

    # Hashli fayllar abadiy keshlanadi
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ⚠️ index.html KESHLANMAYDI: yangi deploy'dan keyin foydalanuvchi
    # eski HTML bilan qolib ketsa, u yo'q bo'lgan assets fayllarni so'raydi
    # va sayt oq ekran bo'ladi
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # React Router: har qanday yo'l index.html ga tushadi
    location / {
        try_files $uri $uri/ /index.html;
    }
}
